name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  acceptance-1b:
    name: 1B acceptance (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native filesystem and cross-platform object acceptance
        shell: bash
        run: FILECLOUD_RUN_1B=1 go test ./cmd/filecloud -run '^TestCrossPlatformAcceptanceMatrix$' -count=1 -timeout=30m -v

  acceptance-1c:
    name: 1C operations and performance acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Reclaim disk for the 10 GiB acceptance fixture
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Run 1C acceptance
        run: ./scripts/acceptance-1c.sh

  build:
    name: Build and smoke test (${{ matrix.goos }})
    needs: [acceptance-1b, acceptance-1c]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            executable: filecloud
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            executable: filecloud
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            executable: filecloud.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native release target
        shell: bash
        env:
          TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          set -euo pipefail
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          if [ "$host" != "$TARGET" ]; then
            echo "runner host $host does not match release target $TARGET" >&2
            exit 1
          fi
      - name: Build versioned binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          build_date=$(git show -s --format=%cI HEAD)
          mkdir -p dist/bin
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main._version=$VERSION -X main._commit=$commit -X main._buildDate=$build_date" \
            -o "dist/bin/$EXECUTABLE" ./cmd/filecloud
      - name: Smoke test released binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          EXECUTABLE: ${{ matrix.executable }}
        run: go run ./tools/release-smoke --binary "dist/bin/$EXECUTABLE" --version "$VERSION"
      - name: Generate native third-party license material
        shell: bash
        env:
          TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go run ./tools/notices --target "$TARGET" --output dist/licenses
      - name: Assemble binary and legal material
        shell: bash
        env:
          PACKAGE: filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$PACKAGE"
          cp "dist/bin/$EXECUTABLE" "dist/$PACKAGE/"
          cp LICENSE docs/distribution.md "dist/$PACKAGE/"
          cp dist/licenses/THIRD_PARTY_NOTICES.md "dist/$PACKAGE/"
          cp -R dist/licenses/third_party_licenses "dist/$PACKAGE/"
      - name: Create and inspect tar archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          PACKAGE: filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/$PACKAGE.tar.gz" "$PACKAGE"
          mkdir -p dist/archive-check
          tar -C dist/archive-check -xzf "dist/$PACKAGE.tar.gz"
          test -x "dist/archive-check/$PACKAGE/$EXECUTABLE"
          test -s "dist/archive-check/$PACKAGE/LICENSE"
          test -s "dist/archive-check/$PACKAGE/THIRD_PARTY_NOTICES.md"
      - name: Create and inspect zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          PACKAGE: filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
          Expand-Archive -Path "dist/$env:PACKAGE.zip" -DestinationPath "dist/archive-check"
          foreach ($path in @(
            "dist/archive-check/$env:PACKAGE/$env:EXECUTABLE",
            "dist/archive-check/$env:PACKAGE/LICENSE",
            "dist/archive-check/$env:PACKAGE/THIRD_PARTY_NOTICES.md"
          )) {
            if (-not (Test-Path -Path $path -PathType Leaf)) {
              throw "archive is missing $path"
            }
          }
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: filecloud-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/filecloud-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: filecloud-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum filecloud-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --verify-tag --title "Filecloud $VERSION" --notes-file docs/distribution.md
